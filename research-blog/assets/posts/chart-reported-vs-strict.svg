<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" font-family="'Space Mono', ui-monospace, Menlo, Monaco, monospace">
  <title>Reported success versus strict success, by policy and model</title>
  <desc>For every policy on both models, the reported success count is far higher than the strict count. On the weak model no policy separates from full observation once scored strictly. On the strong model no policy separates from full observation.</desc>
  <rect x="0" y="0" width="720" height="400" fill="#f8f7f3"/>

  <!-- legend: measure is encoded by fill, not hue -->
  <g font-size="11" fill="#5d584f">
    <rect x="70" y="14" width="14" height="12" rx="3" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
    <text x="90" y="24">reported (run finished)</text>
    <rect x="248" y="14" width="14" height="12" rx="3" fill="#857f74"/>
    <text x="268" y="24">strict (task answered)</text>
    <rect x="424" y="14" width="14" height="12" rx="3" fill="#ff7759"/>
    <text x="444" y="24">adaptive PD</text>
    <rect x="556" y="14" width="14" height="12" rx="3" fill="#857f74" opacity="0.42"/>
    <text x="576" y="24">unjudgeable</text>
  </g>

  <!-- y grid -->
  <g stroke="#e7e4dc" stroke-width="1">
    <line x1="60" y1="40" x2="700" y2="40"/>
    <line x1="60" y1="105" x2="700" y2="105"/>
    <line x1="60" y1="170" x2="700" y2="170"/>
    <line x1="60" y1="235" x2="700" y2="235"/>
  </g>
  <g fill="#93939f" font-size="11" text-anchor="end">
    <text x="52" y="44">20</text>
    <text x="52" y="109">15</text>
    <text x="52" y="174">10</text>
    <text x="52" y="239">5</text>
    <text x="52" y="304">0</text>
  </g>
  <line x1="60" y1="300" x2="700" y2="300" stroke="#d4d1c9" stroke-width="1"/>
  <text x="18" y="170" font-size="11" fill="#5d584f" text-anchor="middle" transform="rotate(-90 18 170)">tasks solved of 20</text>
  

  <!-- panel titles -->
  <g font-size="12" font-weight="700" fill="#2c2925">
    <text x="70" y="356">Weak model — Nemotron-3-super</text>
    <text x="400" y="356">Strong model — GPT-5.4-mini</text>
  </g>
  <line x1="385" y1="40" x2="385" y2="316" stroke="#e7e4dc" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ============ weak model ============ -->
  <!-- full -->
  <rect x="79.5" y="144" width="26" height="156" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="109.5" y="261" width="26" height="39" rx="4" fill="#857f74"/>
  <rect x="109.5" y="246" width="26" height="13" rx="4" fill="#857f74" opacity="0.42"/>
  <!-- top-k -->
  <rect x="154.5" y="105" width="26" height="195" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="184.5" y="235" width="26" height="65" rx="4" fill="#857f74"/>
  <rect x="184.5" y="207" width="26" height="26" rx="4" fill="#857f74" opacity="0.42"/>
  <!-- static PD -->
  <rect x="229.5" y="118" width="26" height="182" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="259.5" y="222" width="26" height="78" rx="4" fill="#857f74"/>
  <rect x="259.5" y="194" width="26" height="26" rx="4" fill="#857f74" opacity="0.42"/>
  <!-- adaptive PD -->
  <rect x="304.5" y="118" width="26" height="182" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="334.5" y="248" width="26" height="52" rx="4" fill="#ff7759"/>
  <rect x="334.5" y="194" width="26" height="52" rx="4" fill="#ff7759" opacity="0.42"/>

  <g font-size="11" fill="#5d584f" text-anchor="middle">
    <text x="92.5" y="138">12</text>
    <text x="167.5" y="99">15</text>
    <text x="242.5" y="112">14</text>
    <text x="317.5" y="112">14</text>
  </g>
  <g font-size="11" font-weight="700" fill="#2c2925" text-anchor="middle">
    <text x="122.5" y="240">3–4</text>
    <text x="197.5" y="201">5–7</text>
    <text x="272.5" y="188">6–8</text>
    <text x="347.5" y="188">4–8</text>
  </g>
  <g font-size="10.5" fill="#5d584f" text-anchor="middle">
    <text x="107.5" y="318">full</text>
    <text x="182.5" y="318">top-k</text>
    <text x="257.5" y="318">static</text>
    <text x="332.5" y="318">adaptive</text>
  </g>

  <!-- ============ strong model ============ -->
  <rect x="409.5" y="53" width="26" height="247" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="439.5" y="196" width="26" height="104" rx="4" fill="#857f74"/>
  <rect x="484.5" y="53" width="26" height="247" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="514.5" y="196" width="26" height="104" rx="4" fill="#857f74"/>
  <rect x="559.5" y="53" width="26" height="247" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="589.5" y="170" width="26" height="130" rx="4" fill="#857f74"/>
  <rect x="634.5" y="53" width="26" height="247" rx="4" fill="#e9e5dc" stroke="#c9c4b8" stroke-width="1"/>
  <rect x="664.5" y="196" width="26" height="104" rx="4" fill="#ff7759"/>

  <g font-size="11" fill="#5d584f" text-anchor="middle">
    <text x="422.5" y="47">19</text>
    <text x="497.5" y="47">19</text>
    <text x="572.5" y="47">19</text>
    <text x="647.5" y="47">19</text>
  </g>
  <g font-size="11" font-weight="700" fill="#2c2925" text-anchor="middle">
    <text x="452.5" y="190">8</text>
    <text x="527.5" y="190">8</text>
    <text x="602.5" y="164">10</text>
    <text x="677.5" y="190">8</text>
  </g>
  <g font-size="10.5" fill="#5d584f" text-anchor="middle">
    <text x="437.5" y="318">full</text>
    <text x="512.5" y="318">top-k</text>
    <text x="587.5" y="318">static</text>
    <text x="662.5" y="318">adaptive</text>
  </g>

  <text x="70" y="378" font-size="10.5" fill="#93939f">Strict counts are pass–(pass+review); the pale cap is answers a rule cannot judge. N=20 per arm.</text>
</svg>
