<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" font-family="'Space Mono', ui-monospace, Menlo, Monaco, monospace">
  <title>Input-token ratio of eight planned Kitsune experiments</title>
  <desc>Intervention over baseline input-token ratios. Rich observation bundle 1.062 and target catalog 1.060, both not adopted. H18 table cells 0.679 but a guard cell at 1.171, inconclusive. H310 0.768 with guards 0.973, supported. H321 stopped with no estimate. H323 0.878 with guards 0.963, supported. H89 0.746, supported. Issue 472 1.001, not supported.</desc>
  <rect x="0" y="0" width="760" height="400" fill="#f8f7f3"/>

  <text x="20" y="28" font-size="12" font-weight="700" fill="#2c2925">Input tokens, intervention ÷ baseline, on the experiment's primary cells</text>

  <!-- grid: r -> 300 + (r - 0.5) * 440 -->
  <g stroke="#e7e4dc" stroke-width="1">
    <line x1="344" y1="48" x2="344" y2="320"/>
    <line x1="388" y1="48" x2="388" y2="320"/>
    <line x1="432" y1="48" x2="432" y2="320"/>
    <line x1="476" y1="48" x2="476" y2="320"/>
    <line x1="564" y1="48" x2="564" y2="320"/>
    <line x1="608" y1="48" x2="608" y2="320"/>
  </g>
  <line x1="520" y1="48" x2="520" y2="320" stroke="#2c2925" stroke-width="1.5"/>
  <text x="520" y="44" font-size="10" fill="#2c2925" text-anchor="middle">no change</text>

  <!-- rows: y = 70 + 32 * i -->
  <g font-size="11" fill="#2c2925">
    <text x="20" y="70" font-weight="700">rich observation bundle</text>
    <text x="20" y="83" font-size="9.5" fill="#5d584f">10-22 · 72 runs · Haiku</text>
    <text x="20" y="102" font-weight="700">role-bucketed target catalog</text>
    <text x="20" y="115" font-size="9.5" fill="#5d584f">10-22 · 60 runs · Haiku</text>
    <text x="20" y="134" font-weight="700">H18 list short runs in full</text>
    <text x="20" y="147" font-size="9.5" fill="#5d584f">10-28 · 66 runs · Opus</text>
    <text x="20" y="166" font-weight="700">H310 budget fills main first</text>
    <text x="20" y="179" font-size="9.5" fill="#5d584f">10-28 · 66 runs · Opus</text>
    <text x="20" y="198" font-weight="700">H321 same, on live sites</text>
    <text x="20" y="211" font-size="9.5" fill="#5d584f">10-28 · 9 of 36 runs · Opus</text>
    <text x="20" y="230" font-weight="700">H323 compact browser_find</text>
    <text x="20" y="243" font-size="9.5" fill="#5d584f">10-29 · 44 runs · Opus</text>
    <text x="20" y="262" font-weight="700">H89 say the tab is the user's</text>
    <text x="20" y="275" font-size="9.5" fill="#5d584f">11-02 · 64 runs · Opus</text>
    <text x="20" y="294" font-weight="700">#472 say new tab, new refs</text>
    <text x="20" y="307" font-size="9.5" fill="#5d584f">11-06 · 64 runs · Opus</text>
  </g>

  <!-- primary dots (filled) and guard (hollow diamond) -->
  <!-- rich bundle 1.062 -->
  <circle cx="547.3" cy="70" r="6" fill="#857f74"/>
  <!-- target catalog 1.060 -->
  <circle cx="546.4" cy="102" r="6" fill="#857f74"/>
  <!-- H18 table 0.679, guard max 1.171 -->
  <line x1="378.8" y1="134" x2="595.2" y2="134" stroke="#c9c4ba" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="378.8" cy="134" r="6" fill="#857f74"/>
  <path d="M595.2 128 l6 6 l-6 6 l-6 -6 z" fill="#f8f7f3" stroke="#857f74" stroke-width="1.6"/>
  <!-- H310 0.768, guard 0.973 -->
  <line x1="417.9" y1="166" x2="508.1" y2="166" stroke="#ffc2b3" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="417.9" cy="166" r="6" fill="#ff7759"/>
  <path d="M508.1 160 l6 6 l-6 6 l-6 -6 z" fill="#f8f7f3" stroke="#ff7759" stroke-width="1.6"/>
  <!-- H321 stopped -->
  <rect x="446" y="190" width="148" height="16" fill="#f8f7f3"/>
  <text x="520" y="202" font-size="10" fill="#93939f" text-anchor="middle">change never exercised</text>
  <!-- H323 0.878, guard 0.963 -->
  <line x1="466.3" y1="230" x2="503.7" y2="230" stroke="#ffc2b3" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="466.3" cy="230" r="6" fill="#ff7759"/>
  <path d="M503.7 224 l6 6 l-6 6 l-6 -6 z" fill="#f8f7f3" stroke="#ff7759" stroke-width="1.6"/>
  <!-- H89 0.746 -->
  <circle cx="408.2" cy="262" r="6" fill="#ff7759"/>
  <!-- #472 1.001 -->
  <circle cx="520.4" cy="294" r="6" fill="#857f74"/>

  <!-- verdicts -->
  <g font-size="10.5" fill="#5d584f">
    <text x="640" y="74">not adopted</text>
    <text x="640" y="106">not adopted</text>
    <text x="640" y="138">inconclusive</text>
    <text x="640" y="170" font-weight="700" fill="#2c2925">support</text>
    <text x="640" y="202">stopped</text>
    <text x="640" y="234" font-weight="700" fill="#2c2925">support</text>
    <text x="640" y="266" font-weight="700" fill="#2c2925">support</text>
    <text x="640" y="298">not supported</text>
  </g>

  <line x1="300" y1="320" x2="620" y2="320" stroke="#d4d1c9"/>
  <g font-size="10.5" fill="#93939f" text-anchor="middle">
    <text x="344" y="337">0.6</text>
    <text x="388" y="337">0.7</text>
    <text x="432" y="337">0.8</text>
    <text x="476" y="337">0.9</text>
    <text x="520" y="337">1.0</text>
    <text x="564" y="337">1.1</text>
    <text x="608" y="337">1.2</text>
  </g>
  <text x="330" y="354" font-size="10.5" fill="#5d584f">&#8592; fewer tokens</text>
  <text x="610" y="354" font-size="10.5" fill="#5d584f" text-anchor="end">more tokens &#8594;</text>

  <circle cx="26" cy="375" r="5" fill="#ff7759"/>
  <text x="36" y="379" font-size="10" fill="#5d584f">primary cells, supported</text>
  <circle cx="226" cy="375" r="5" fill="#857f74"/>
  <text x="236" y="379" font-size="10" fill="#5d584f">primary cells, other verdicts</text>
  <path d="M456 370 l5 5 l-5 5 l-5 -5 z" fill="#f8f7f3" stroke="#5d584f" stroke-width="1.4"/>
  <text x="466" y="379" font-size="10" fill="#5d584f">guard cells (H18: worst cell)</text>
  <text x="20" y="395" font-size="9.5" fill="#93939f">Kitsune-only A/B, Claude Code. Rows 1–2 compare matched sums; the rest are predeclared ratios. Not one pooled analysis.</text>
</svg>
