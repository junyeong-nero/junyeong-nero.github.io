<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" font-family="'Space Mono', ui-monospace, Menlo, Monaco, monospace">
  <title>Token cost versus strict task success, every policy and model</title>
  <desc>Adaptive disclosure on the weak model sits far to the left at a third of full observation's tokens, at the same strict success as full. On the strong model the policies differ little in either cost or success.</desc>
  <rect x="0" y="0" width="720" height="400" fill="#f8f7f3"/>

  <!-- legend: model is encoded by mark shape, not hue -->
  <g font-size="11" fill="#5d584f">
    <rect x="70" y="15" width="8" height="12" rx="3" fill="#857f74"/>
    <text x="86" y="25">weak model (strict range)</text>
    <circle cx="270" cy="21" r="6" fill="#857f74"/>
    <text x="282" y="25">strong model</text>
    <circle cx="386" cy="21" r="6" fill="#ff7759"/>
    <text x="398" y="25">adaptive PD</text>
  </g>

  <!-- grid -->
  <g stroke="#e7e4dc" stroke-width="1">
    <line x1="70" y1="50" x2="700" y2="50"/>
    <line x1="70" y1="121.4" x2="700" y2="121.4"/>
    <line x1="70" y1="210.7" x2="700" y2="210.7"/>
    <line x1="196" y1="50" x2="196" y2="300"/>
    <line x1="322" y1="50" x2="322" y2="300"/>
    <line x1="448" y1="50" x2="448" y2="300"/>
    <line x1="574" y1="50" x2="574" y2="300"/>
  </g>
  <!-- full-observation reference -->
  <line x1="490" y1="50" x2="490" y2="300" stroke="#c9c4b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="496" y="294" font-size="10.5" fill="#93939f">full = 1.00&#215;</text>

  <g fill="#93939f" font-size="11" text-anchor="end">
    <text x="62" y="54">14</text>
    <text x="62" y="125.4">10</text>
    <text x="62" y="214.7">5</text>
    <text x="62" y="304">0</text>
  </g>
  <line x1="70" y1="300" x2="700" y2="300" stroke="#d4d1c9" stroke-width="1"/>
  <g fill="#93939f" font-size="11" text-anchor="middle">
    <text x="196" y="318">0.3&#215;</text>
    <text x="322" y="318">0.6&#215;</text>
    <text x="448" y="318">0.9&#215;</text>
    <text x="574" y="318">1.2&#215;</text>
    <text x="700" y="318">1.5&#215;</text>
  </g>
  <text x="385" y="342" font-size="11" fill="#5d584f" text-anchor="middle">avg tokens per task, relative to full observation &#8594;</text>
  <text x="20" y="175" font-size="11" fill="#5d584f" text-anchor="middle" transform="rotate(-90 20 175)">&#8592; strict tasks solved of 20</text>

  <!-- ===== weak model: vertical bars spanning pass to pass+review ===== -->
  <rect x="486" y="228.6" width="8" height="17.8" rx="4" fill="#857f74"/>
  <rect x="582.6" y="175" width="8" height="35.7" rx="4" fill="#857f74"/>
  <rect x="645.6" y="157.1" width="8" height="35.8" rx="4" fill="#857f74"/>
  <rect x="200.4" y="157.1" width="8" height="71.5" rx="4" fill="#ff7759"/>

  <g font-size="10.5" fill="#5d584f" text-anchor="middle">
    <text x="490" y="262">full</text>
    <text x="586.6" y="227">top-k</text>
    <text x="649.6" y="209">static PD</text>
  </g>
  <text x="204.4" y="148" font-size="11.5" font-weight="700" fill="#2c2925" text-anchor="middle">adaptive PD</text>
  <text x="204.4" y="245" font-size="10.5" fill="#5d584f" text-anchor="middle">0.32&#215;</text>

  <!-- ===== strong model: circles ===== -->
  <circle cx="490" cy="157.1" r="6" fill="#857f74" stroke="#f8f7f3" stroke-width="2"/>
  <circle cx="469" cy="157.1" r="6" fill="#857f74" stroke="#f8f7f3" stroke-width="2"/>
  <circle cx="513.1" cy="121.4" r="6" fill="#857f74" stroke="#f8f7f3" stroke-width="2"/>
  <circle cx="529.5" cy="157.1" r="6" fill="#ff7759" stroke="#f8f7f3" stroke-width="2"/>

  <g font-size="10.5" fill="#5d584f">
    <text x="490" y="180" text-anchor="middle">full</text>
    <text x="462" y="146" text-anchor="end">top-k</text>
    <text x="519" y="112">static PD</text>
  </g>
  <text x="541" y="161" font-size="11.5" font-weight="700" fill="#2c2925">adaptive PD</text>

  <text x="70" y="368" font-size="10.5" fill="#93939f">Strict success only. Token counts are not comparable across models.</text>
  <text x="70" y="384" font-size="10.5" fill="#93939f">Weak-model bars overlap: no arm separates from full on success. The horizontal gap is the finding.</text>
</svg>
