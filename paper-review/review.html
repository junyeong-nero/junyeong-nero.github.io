<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Review Detail | Junyeong Song</title>
  <meta name="description" content="Paper review detail with rendered notes and captured figures.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>

<body>
  <header class="site-header">
    <nav class="header-nav" aria-label="Site sections">
      <a href="/portfolio/" class="nav-item">Portfolio</a>
      <a href="/research-blog/" class="nav-item">Research Blog</a>
      <a href="./" class="nav-item">Paper Review</a>
    </nav>
  </header>

  <main class="page-shell detail-shell">
    <p class="kicker">Research Notes</p>
    <p class="load-error" data-review-error role="alert" hidden></p>
    <section data-review-detail aria-label="Paper review detail">
      <div class="empty-state">
        <h2>Loading review</h2>
        <p>The review is loading from static Markdown.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>(c) 2026 Junyeong Song. Paper notes are generated locally and served statically.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
