<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wordle | Games</title>
  <meta name="description" content="6번 안에 5글자 영어 단어 맞히기. 친구와 같은 단어로 실시간 레이스.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="wordle.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script type="module" src="game.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../" aria-label="게임 목록"><svg class="icon"><use href="../shared/icons.svg#i-back"/></svg></a>
    <h1>Wordle</h1>
  </header>

  <main id="lobby" class="lobby"></main>

  <main id="game" class="game" hidden>
    <div class="hud">
      <div class="player me" aria-label="내 시도 횟수">
        <svg class="icon"><use href="../shared/icons.svg#i-user"/></svg>
        <span class="score" id="my-tries">0/6</span>
      </div>
      <div class="clock" aria-label="걸린 시간"><svg class="icon"><use href="../shared/icons.svg#i-clock"/></svg><span id="clock-text">0:00</span></div>
      <div class="player opp" id="opp-panel" aria-label="상대 진행" hidden>
        <div class="opp-mini" id="opp-mini" aria-hidden="true"></div>
        <svg class="icon"><use href="../shared/icons.svg#i-user"/></svg>
        <span class="score" id="opp-tries">0/6</span>
      </div>
    </div>

    <div class="board-wrap" id="board-wrap"><div class="board" id="board"></div></div>

    <div class="keyboard" id="keyboard" aria-label="키보드"></div>
  </main>
</body>

</html>
