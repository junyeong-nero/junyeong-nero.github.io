<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>사과게임 | Games</title>
  <meta name="description" content="합이 10이 되도록 사과를 드래그해서 지우는 사과게임. 친구와 같은 판으로 실시간 대결.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="apple.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script type="module" src="game.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../" aria-label="게임 목록"><svg class="icon"><use href="../shared/icons.svg#i-back"/></svg></a>
    <h1>사과게임</h1>
  </header>

  <main id="lobby" class="lobby"></main>

  <main id="game" class="game" hidden>
    <div class="hud">
      <div class="player me" aria-label="내 점수">
        <svg class="icon"><use href="../shared/icons.svg#i-user"/></svg>
        <span class="score" id="my-score">0</span>
      </div>
      <div class="clock" id="clock" aria-label="남은 시간"><svg class="icon"><use href="../shared/icons.svg#i-clock"/></svg><span id="clock-text">2:00</span></div>
      <div class="player opp" id="opp-panel" aria-label="상대 점수" hidden>
        <div class="mini" id="opp-mini" aria-hidden="true"></div>
        <svg class="icon"><use href="../shared/icons.svg#i-user"/></svg>
        <span class="score" id="opp-score">0</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="board" id="board"></div>
        <div class="sel-box" id="sel-box" hidden></div>
        <div class="timer" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div>
      </div>
    </div>
  </main>
</body>

</html>
